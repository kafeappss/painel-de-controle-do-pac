<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Painel do PAC</title>
<meta name="description" content="Cronograma do Projeto do PAC: 5 semanas de preparação e 3 aulas da oficina de lógica de programação.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%230b0b0b'/%3E%3Crect x='6' y='8' width='13' height='4' rx='2' fill='%232a78d6'/%3E%3Crect x='11' y='14' width='15' height='4' rx='2' fill='%23eb6834'/%3E%3Crect x='8' y='20' width='10' height='4' rx='2' fill='%231baf7a'/%3E%3C/svg%3E">
<style>
  :root {
    color-scheme: light;
    --page: #f6f5f2;
    --surface: #fcfcfb;
    --ink: #0b0b0b;
    --ink-2: #52514e;
    --ink-3: #6b6a65;
    --grid: #e6e5df;
    --border: rgba(11, 11, 11, 0.10);
    --wash: rgba(11, 11, 11, 0.04);
    --accent: #2a78d6;
    --c1: #2a78d6; --c2: #eb6834; --c3: #1baf7a; --c4: #eda100;
    --c5: #e87ba4; --c6: #008300; --c7: #4a3aa7; --c8: #e34948;
    --tint: 17%;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      color-scheme: dark;
      --page: #0d0d0d;
      --surface: #1a1a19;
      --ink: #ffffff;
      --ink-2: #c3c2b7;
      --ink-3: #9d9c95;
      --grid: #2c2c2a;
      --border: rgba(255, 255, 255, 0.10);
      --wash: rgba(255, 255, 255, 0.04);
      --accent: #3987e5;
      --c1: #3987e5; --c2: #d95926; --c3: #199e70; --c4: #c98500;
      --c5: #d55181; --c6: #008300; --c7: #9085e9; --c8: #e66767;
      --tint: 26%;
    }
  }
  :root[data-theme="dark"] {
    color-scheme: dark;
    --page: #0d0d0d;
    --surface: #1a1a19;
    --ink: #ffffff;
    --ink-2: #c3c2b7;
    --ink-3: #9d9c95;
    --grid: #2c2c2a;
    --border: rgba(255, 255, 255, 0.10);
    --wash: rgba(255, 255, 255, 0.04);
    --accent: #3987e5;
    --c1: #3987e5; --c2: #d95926; --c3: #199e70; --c4: #c98500;
    --c5: #d55181; --c6: #008300; --c7: #9085e9; --c8: #e66767;
    --tint: 26%;
  }

  * { box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; }
  body {
    margin: 0;
    background: var(--page);
    color: var(--ink);
    font: 15px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  }
  button { font: inherit; color: inherit; }
  button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  .page { max-width: 1280px; margin: 0 auto; padding: 24px 16px 48px; }
  @media (min-width: 720px) { .page { padding: 40px 32px 64px; } }

  /* ---------- Topo ---------- */
  .top { display: flex; flex-wrap: wrap; align-items: flex-end; justify-content: space-between; gap: 16px 32px; }
  .eyebrow { margin: 0; font-size: 12px; font-weight: 600; letter-spacing: .08em; text-transform: uppercase; color: var(--ink-3); }
  h1 { margin: 2px 0 6px; font-size: clamp(28px, 5vw, 40px); line-height: 1.1; letter-spacing: -0.02em; font-weight: 750; }
  .goal { display: flex; align-items: flex-start; gap: 8px; margin: 0; max-width: 660px; font-size: 16px; color: var(--ink-2); }
  .goal svg { flex: none; margin-top: 3px; color: var(--accent); }
  .goal b { color: var(--ink); font-weight: 650; }

  .count {
    display: flex;
    align-items: center;
    gap: 14px;
    padding: 12px 18px 12px 16px;
    border-radius: 16px;
    background: var(--ink);
    color: var(--surface);
  }
  .count-n { font-size: 44px; font-weight: 750; line-height: 1; letter-spacing: -0.03em; }
  .count-t { font-size: 14px; line-height: 1.35; }
  .count-t b { font-weight: 650; }
  .count-t span { opacity: .72; font-size: 13px; }

  .facts { display: flex; flex-wrap: wrap; gap: 8px; margin: 18px 0 0; padding: 0; list-style: none; }
  .facts li {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 6px 12px 6px 10px;
    border-radius: 999px;
    background: var(--surface);
    border: 1px solid var(--border);
    font-size: 14px;
    color: var(--ink-2);
  }
  .facts svg { flex: none; color: var(--ink-3); }
  .facts b { color: var(--ink); font-weight: 650; }

  /* ---------- Cartão do cronograma ---------- */
  .card {
    margin-top: 20px;
    padding: 16px 12px 14px;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 18px;
    container-type: inline-size;
  }
  @media (min-width: 720px) { .card { padding: 20px 20px 16px; } }
  .card-head { display: flex; flex-wrap: wrap; align-items: baseline; justify-content: space-between; gap: 4px 16px; margin: 0 4px 12px; }
  h2 { margin: 0; font-size: 17px; font-weight: 650; }
  .hint { margin: 0; font-size: 13px; color: var(--ink-3); }

  /* ---------- Pills (equipes) ---------- */
  .pill {
    display: flex;
    align-items: center;
    gap: 7px;
    min-height: 32px;
    margin: 0;
    padding: 5px 12px 5px 9px;
    border: 0;
    border-radius: 16px;
    background: color-mix(in srgb, var(--c) var(--tint), var(--surface));
    box-shadow: inset 0 0 0 1px color-mix(in srgb, var(--c) 32%, transparent);
    font-size: 13px;
    font-weight: 600;
    line-height: 1.2;
    text-align: left;
    cursor: pointer;
    transition: opacity .15s, box-shadow .12s, transform .12s;
  }
  .pill::before { content: ""; flex: none; width: 9px; height: 9px; border-radius: 50%; background: var(--c); }
  .pill:hover { box-shadow: inset 0 0 0 1.5px var(--c); }
  .pill.is-handoff { box-shadow: inset 0 0 0 1.5px var(--c); }
  .pill.is-handoff::before { content: "⇄"; width: auto; height: auto; border-radius: 0; background: none; color: var(--c); font-size: 13px; font-weight: 800; line-height: 1; }
  .pill .ho { margin-left: auto; padding-left: 4px; font-size: 11px; font-weight: 650; color: var(--ink-3); white-space: nowrap; }

  .filtros { display: flex; gap: 6px; margin: 0 0 4px; padding: 2px 4px 8px; overflow-x: auto; scrollbar-width: thin; }
  .filtros .pill { flex: none; white-space: nowrap; }
  .filtros .todas { --c: var(--ink-3); }
  .filtros .todas::before { display: none; }
  .filtros .pill[aria-pressed="true"] { box-shadow: inset 0 0 0 2px var(--c); background: color-mix(in srgb, var(--c) calc(var(--tint) + 12%), var(--surface)); }
  .filtros .todas[aria-pressed="true"] { background: var(--ink); color: var(--surface); box-shadow: none; }
  @container (min-width: 600px) { .filtros { flex-wrap: wrap; overflow: visible; } }

  .resumo {
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    gap: 4px 10px;
    margin: 4px 4px 14px;
    padding: 10px 12px;
    border-radius: 12px;
    background: color-mix(in srgb, var(--c) 10%, var(--surface));
    font-size: 14px;
    color: var(--ink-2);
  }
  .resumo[hidden] { display: none; }
  .resumo b { color: var(--ink); }
  .resumo button { margin-left: auto; padding: 2px 8px; border: 0; border-radius: 999px; background: var(--wash); cursor: pointer; font-size: 13px; font-weight: 600; color: var(--ink-2); }

  /* ---------- Quadro de semanas ---------- */
  .quadro { display: grid; grid-template-columns: repeat(auto-fill, minmax(250px, 1fr)); gap: 12px; }
  .band {
    grid-column: 1 / -1;
    display: flex;
    align-items: baseline;
    gap: 8px;
    padding: 6px 12px;
    border-radius: 10px;
    font-size: 13px;
    font-weight: 700;
  }
  .band span { font-weight: 500; opacity: .8; }
  .band--prep { background: var(--wash); color: var(--ink-2); box-shadow: inset 0 0 0 1px var(--border); }
  .band--aula { background: var(--ink); color: var(--surface); }
  .band + .col { }

  .col {
    display: flex;
    flex-direction: column;
    gap: 6px;
    padding: 12px;
    border-radius: 14px;
    background: var(--wash);
    box-shadow: inset 0 0 0 1px var(--border);
    transition: opacity .15s;
  }
  .col.is-aula { background: color-mix(in srgb, var(--ink) 6%, var(--surface)); }
  .col.is-now { box-shadow: inset 0 0 0 2px var(--accent); background: color-mix(in srgb, var(--accent) 7%, var(--surface)); }
  .col.is-done { opacity: .55; }

  .col-head { display: flex; flex-wrap: wrap; align-items: center; gap: 2px 8px; margin-bottom: 4px; }
  .col-head h3 { margin: 0; font-size: 15px; font-weight: 700; }
  .col-head .dt { flex-basis: 100%; font-size: 12.5px; color: var(--ink-3); font-variant-numeric: tabular-nums; }
  .badge { padding: 0 7px; border-radius: 999px; font-size: 11px; font-weight: 700; line-height: 19px; white-space: nowrap; }
  .badge--now { background: var(--accent); color: #fff; }
  .badge--prazo { background: var(--ink); color: var(--surface); }
  .badge--done { background: var(--wash); color: var(--ink-3); box-shadow: inset 0 0 0 1px var(--border); }

  .pills { display: flex; flex-wrap: wrap; gap: 6px; }
  .col-foot { display: flex; flex-direction: column; gap: 3px; margin-top: 4px; font-size: 12px; line-height: 1.35; color: var(--ink-3); }
  .col-foot:empty { display: none; }
  .col-foot b { color: var(--ink-2); font-weight: 650; }

  /* destaque de equipe */
  .quadro.has-sel .pill:not(.is-sel) { opacity: .22; }
  .quadro.has-sel .col:not(:has(.pill.is-sel)) { opacity: .45; }

  /* Tela larga: vira um Gantt — semanas lado a lado, cada equipe sempre na mesma linha */
  @container (min-width: 900px) {
    .quadro {
      grid-template-columns: repeat(var(--ncols), minmax(0, 1fr));
      grid-template-rows: auto auto repeat(var(--nlin), auto) auto;
      gap: 6px 8px;
    }
    .band { grid-row: 1; grid-column: var(--gc); justify-content: center; }
    .col {
      grid-row: 2 / -1;
      display: grid;
      grid-template-rows: subgrid;
      gap: 6px;
      padding: 10px 6px;
    }
    .col-head { grid-row: 1; margin: 0 4px 4px; }
    .pills { display: contents; }
    .pill { grid-row: var(--r); }
    .col .pill { align-self: stretch; padding: 5px 9px 5px 8px; font-size: 12.5px; }
    .col .pill .ho { display: none; }
    .col-foot { grid-row: -2; margin: 4px 4px 0; }
    .col-foot:empty { display: block; }
  }

  .legend {
    display: flex;
    flex-wrap: wrap;
    gap: 6px 18px;
    margin: 14px 4px 0;
    padding: 0;
    list-style: none;
    font-size: 12.5px;
    color: var(--ink-3);
  }
  .legend li { display: flex; align-items: center; gap: 7px; }
  .lg-ho { font-weight: 800; color: var(--ink-2); }
  .lg-now { width: 16px; height: 12px; border-radius: 4px; box-shadow: inset 0 0 0 2px var(--accent); }

  @media print {
    body { background: #fff; }
    .filtros, .hint { display: none; }
    * { -webkit-print-color-adjust: exact; print-color-adjust: exact; }
  }
  @media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>
</head>
<body>
<main class="page">
  <header class="top">
    <div>
      <p class="eyebrow">Painel de controle</p>
      <h1 id="titulo"></h1>
      <p class="goal">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="5"/><circle cx="12" cy="12" r="1.2" fill="currentColor"/></svg>
        <span><b>Objetivo:</b> <span id="objetivo"></span></span>
      </p>
    </div>
    <div class="count" id="contagem"></div>
  </header>

  <ul class="facts" id="fatos"></ul>

  <section class="card" aria-labelledby="t-crono">
    <div class="card-head">
      <h2 id="t-crono">Cronograma</h2>
      <p class="hint">Toque em uma equipe para ver o caminho dela</p>
    </div>
    <div class="filtros" id="filtros" role="toolbar" aria-label="Destacar equipe"></div>
    <div class="resumo" id="resumo" aria-live="polite" hidden></div>
    <div class="quadro" id="quadro"></div>
    <ul class="legend">
      <li><span class="lg-ho">⇄</span>Handoff (passagem de trabalho entre equipes)</li>
      <li><span class="lg-now"></span>Semana atual</li>
    </ul>
  </section>
</main>

<script>
(() => {
  "use strict";

  /* =====================================================================
     DADOS DO PROJETO — edite aqui para mudar datas, equipes e aulas.
     Datas no formato AAAA-MM-DD. "cor" vai de 1 a 8.
     ===================================================================== */
  const DADOS = {
    fase: "Projeto do PAC",
    objetivo: "montar e executar uma oficina que ensine lógica de programação.",
    prazoFinal: "2026-11-14",
    horario: "08:30–12:00",
    maxAlunos: 21,

    semanas: [
      { nome: "Semana 1", inicio: "2026-10-06", fim: "2026-10-13" },
      { nome: "Semana 2", inicio: "2026-10-14", fim: "2026-10-21" },
      { nome: "Semana 3", inicio: "2026-10-22", fim: "2026-10-29" },
      { nome: "Semana 4", inicio: "2026-10-30", fim: "2026-11-06" },
      { nome: "Semana 5", inicio: "2026-11-07", fim: "2026-11-13" },
    ],

    aulas: [
      { nome: "Aula 1", data: "2026-11-14" },
      { nome: "Aula 2", data: "2026-11-21" },
      { nome: "Aula 3", data: "2026-11-28" },
    ],

    // Ordem das equipes dentro de cada semana. Pares de handoff ficam vizinhos.
    equipes: [
      { nome: "Geração de Conteúdo", cor: 1, semanas: [1, 2, 3], handoff: { semana: 3, para: "Atividades Práticas" } },
      { nome: "Atividades Práticas", cor: 2, semanas: [3, 4, 5], handoff: { semana: 3, de: "Geração de Conteúdo" } },
      { nome: "Experiência", cor: 3, semanas: [1, 2, 3], handoff: { semana: 3, para: "Ambiente e Suporte" } },
      { nome: "Ambiente e Suporte", cor: 4, semanas: [3, 4, 5], handoff: { semana: 3, de: "Experiência" }, acompanhaAulas: true },
      { nome: "Avaliação de Qualidade", cor: 5, semanas: [2, 3, 4, 5] },
      { nome: "Mentores", cor: 6, semanas: [3, 4, 5], acompanhaAulas: true },
      { nome: "Professores", cor: 7, semanas: [3, 4, 5], acompanhaAulas: true },
      { nome: "Comunicação e Registro", cor: 8, semanas: [1, 3, 5], acompanhaAulas: true },
    ],

    feriados: [
      { data: "2026-10-12", nome: "Nossa Senhora Aparecida" },
      { data: "2026-11-02", nome: "Finados" },
      { data: "2026-11-15", nome: "Proclamação da República" },
      { data: "2026-11-20", nome: "Dia da Consciência Negra" },
    ],
  };

  /* ---------------- datas ---------------- */
  const DIA_MS = 864e5;
  const num = s => { const [a, m, d] = s.split("-").map(Number); return Date.UTC(a, m - 1, d) / DIA_MS; };
  const asDate = n => new Date(n * DIA_MS);
  const pad = n => String(n).padStart(2, "0");
  const ddmm = n => { const d = asDate(n); return pad(d.getUTCDate()) + "/" + pad(d.getUTCMonth() + 1); };
  const SEM = ["dom", "seg", "ter", "qua", "qui", "sex", "sáb"];
  const ds = n => SEM[asDate(n).getUTCDay()];
  const lista = xs => (xs.length < 2 ? xs.join("") : xs.slice(0, -1).join(", ") + " e " + xs[xs.length - 1]);
  const slug = s => s.normalize("NFD").replace(/[̀-ͯ]/g, "").toLowerCase().replace(/[^a-z0-9]+/g, "-").replace(/^-|-$/g, "");
  const runs = ns => ns.reduce((acc, n) => {
    const r = acc[acc.length - 1];
    if (r && n === r[1] + 1) r[1] = n; else acc.push([n, n]);
    return acc;
  }, []);

  const semanas = DADOS.semanas.map((s, i) => ({ ...s, n: i + 1, ini: num(s.inicio), fim: num(s.fim) }));
  const aulas = DADOS.aulas.map((a, i) => ({ ...a, n: i + 1, dia: num(a.data) }));
  const feriados = DADOS.feriados.map(f => ({ ...f, dia: num(f.data) }));
  const prazo = num(DADOS.prazoFinal);
  const eqs = DADOS.equipes.map((e, i) => ({ ...e, id: slug(e.nome), cor: `var(--c${e.cor || i + 1})` }));

  // Hoje (pode ser simulado com ?hoje=AAAA-MM-DD na URL)
  const hoje = (() => {
    const p = new URLSearchParams(location.search).get("hoje");
    if (p && /^\d{4}-\d{2}-\d{2}$/.test(p)) return num(p);
    const t = new Date();
    return Date.UTC(t.getFullYear(), t.getMonth(), t.getDate()) / DIA_MS;
  })();
  const semanaAtual = semanas.find(s => hoje >= s.ini && hoje <= s.fim) || null;
  const aulaHoje = aulas.find(a => a.dia === hoje) || null;
  const proximaAula = aulas.find(a => a.dia > hoje) || null;

  /* ---------------- DOM ---------------- */
  const h = (tag, attrs, ...kids) => {
    const el = document.createElement(tag);
    for (const [k, v] of Object.entries(attrs || {})) {
      if (v == null || v === false) continue;
      if (k === "class") el.className = v;
      else if (k === "style") el.style.cssText = v;
      else el.setAttribute(k, v === true ? "" : v);
    }
    for (const kid of kids.flat()) if (kid != null && kid !== false) el.append(kid);
    return el;
  };
  const icone = path => {
    const s = document.createElementNS("http://www.w3.org/2000/svg", "svg");
    s.setAttribute("width", "16"); s.setAttribute("height", "16"); s.setAttribute("viewBox", "0 0 24 24");
    s.setAttribute("fill", "none"); s.setAttribute("stroke", "currentColor"); s.setAttribute("stroke-width", "2");
    s.setAttribute("stroke-linecap", "round"); s.setAttribute("aria-hidden", "true");
    s.innerHTML = path;
    return s;
  };

  /* ---------------- Topo ---------------- */
  function montarTopo() {
    document.getElementById("titulo").textContent = DADOS.fase;
    document.getElementById("objetivo").textContent = DADOS.objetivo;

    const c = document.getElementById("contagem");
    const contagem = (n, alvo, sub) => c.append(h("div", { class: "count-n" }, String(n)),
      h("div", { class: "count-t" }, h("b", {}, n === 1 ? "dia" : "dias"), ` para a ${alvo}`, h("br"), h("span", {}, sub)));
    if (hoje < prazo) contagem(prazo - hoje, aulas[0].nome, `Prazo final · ${ds(prazo)} ${ddmm(prazo)}`);
    else if (aulaHoje) c.append(h("div", { class: "count-n" }, "Hoje"),
      h("div", { class: "count-t" }, h("b", {}, aulaHoje.nome), h("br"), h("span", {}, DADOS.horario)));
    else if (proximaAula) contagem(proximaAula.dia - hoje, proximaAula.nome, `${ds(proximaAula.dia)} ${ddmm(proximaAula.dia)}`);
    else c.append(h("div", { class: "count-n" }, "✓"),
      h("div", { class: "count-t" }, h("b", {}, "Oficina concluída"), h("br"), h("span", {}, `${aulas.length} aulas realizadas`)));

    const ICON_CAL = '<rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 10h18M8 3v4M16 3v4"/>';
    const ICON_HORA = '<circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/>';
    const ICON_PESSOAS = '<circle cx="9" cy="8" r="3.5"/><path d="M2.5 20c.8-3.5 3.4-5.5 6.5-5.5s5.7 2 6.5 5.5M16 4.5a3.5 3.5 0 0 1 0 7M18 14.8c1.9.7 3.1 2.5 3.5 5.2"/>';
    document.getElementById("fatos").append(
      h("li", {}, icone(ICON_CAL), "Aulas: ", h("b", {}, aulas.map(a => ddmm(a.dia)).join(" · "))),
      h("li", {}, icone(ICON_HORA), h("b", {}, DADOS.horario)),
      h("li", {}, icone(ICON_PESSOAS), "Máx. ", h("b", {}, `${DADOS.maxAlunos} alunos`)));
  }

  /* ---------------- Quadro (semanas + aulas com pills) ---------------- */
  const quadro = document.getElementById("quadro");
  const nS = semanas.length, nA = aulas.length;

  const pill = (e, onde, ho) => h("button", {
    type: "button",
    class: "pill" + (ho ? " is-handoff" : ""),
    "data-eq": e.id,
    style: `--c:${e.cor};--r:${eqs.indexOf(e) + 2}`,
    title: ho ? (ho.para ? `Handoff: passa para ${ho.para}` : `Handoff: recebe de ${ho.de}`) : null,
    "aria-label": `${e.nome}, ${onde}` + (ho ? (ho.para ? `, handoff para ${ho.para}` : `, recebe handoff de ${ho.de}`) : ""),
  }, h("span", {}, e.nome), ho && h("span", { class: "ho", "aria-hidden": "true" }, "handoff"));

  function montarQuadro() {
    quadro.style.setProperty("--ncols", nS + nA);
    quadro.style.setProperty("--nlin", eqs.length);

    quadro.append(h("div", { class: "band band--prep", style: `--gc:1 / ${nS + 1}` },
      DADOS.fase, h("span", {}, `${ddmm(semanas[0].ini)} → prazo final ${ddmm(prazo)}`)));

    semanas.forEach(s => {
      const time = eqs.filter(e => e.semanas.includes(s.n));
      const handoffs = time.filter(e => e.handoff && e.handoff.semana === s.n && e.handoff.para);
      const fer = feriados.filter(f => f.dia >= s.ini && f.dia <= s.fim);
      const agora = semanaAtual === s, feita = hoje > s.fim;
      quadro.append(h("section", { class: "col" + (agora ? " is-now" : "") + (feita ? " is-done" : ""), "aria-label": s.nome },
        h("div", { class: "col-head" },
          h("h3", {}, s.nome),
          agora && h("span", { class: "badge badge--now" }, "Agora"),
          feita && h("span", { class: "badge badge--done" }, "Concluída"),
          h("span", { class: "dt", title: `${ds(s.ini)} ${ddmm(s.ini)} a ${ds(s.fim)} ${ddmm(s.fim)}` }, `${ddmm(s.ini)} – ${ddmm(s.fim)}`)),
        h("div", { class: "pills" }, time.map(e => pill(e, s.nome, e.handoff && e.handoff.semana === s.n ? e.handoff : null))),
        h("div", { class: "col-foot" },
          handoffs.map(e => h("div", {}, h("b", {}, "⇄ "), `${e.nome} → ${e.handoff.para}`)),
          fer.map(f => h("div", {}, h("b", {}, "Feriado "), `${ds(f.dia)} ${ddmm(f.dia)}`)))));
    });

    quadro.append(h("div", { class: "band band--aula", style: `--gc:${nS + 1} / ${nS + nA + 1}` },
      "Aulas", h("span", {}, `${DADOS.horario} · até ${DADOS.maxAlunos} alunos`)));

    const acompanham = eqs.filter(e => e.acompanhaAulas);
    aulas.forEach(a => {
      const ehHoje = aulaHoje === a, proxima = !aulaHoje && proximaAula === a && !semanaAtual, feita = a.dia < hoje;
      quadro.append(h("section", { class: "col is-aula" + (ehHoje || proxima ? " is-now" : "") + (feita ? " is-done" : ""), "aria-label": a.nome },
        h("div", { class: "col-head" },
          h("h3", {}, a.nome),
          ehHoje && h("span", { class: "badge badge--now" }, "Hoje"),
          proxima && h("span", { class: "badge badge--now" }, "Próxima"),
          feita && h("span", { class: "badge badge--done" }, "Realizada"),
          a.dia === prazo && h("span", { class: "badge badge--prazo" }, "Prazo final"),
          h("span", { class: "dt" }, `${ds(a.dia)} ${ddmm(a.dia)} · ${DADOS.horario.split(/[–-]/)[0]}`)),
        h("div", { class: "pills" }, acompanham.map(e => pill(e, a.nome, null))),
        h("div", { class: "col-foot" })));
    });

    quadro.addEventListener("click", ev => {
      const el = ev.target.closest(".pill");
      if (el) selecionar(sel === el.dataset.eq ? null : el.dataset.eq);
    });
  }

  /* ---------------- Filtro por equipe ---------------- */
  const filtros = document.getElementById("filtros");
  const resumo = document.getElementById("resumo");
  let sel = null;

  function montarFiltros() {
    filtros.append(h("button", { type: "button", class: "pill todas", "data-eq": "" }, "Todas as equipes"),
      ...eqs.map(e => h("button", { type: "button", class: "pill", "data-eq": e.id, style: `--c:${e.cor}` }, e.nome)));
    filtros.addEventListener("click", ev => {
      const el = ev.target.closest(".pill");
      if (el) selecionar(el.dataset.eq && el.dataset.eq !== sel ? el.dataset.eq : null);
    });
  }

  function textoEquipe(e) {
    const rs = runs(e.semanas);
    const periodo = rs.map(([a, b]) => (a === b
      ? `Semana ${a}` : `Semanas ${a} a ${b}`)).join(", ");
    const datas = rs.length === 1 ? ` (${ddmm(semanas[rs[0][0] - 1].ini)} a ${ddmm(semanas[rs[0][1] - 1].fim)})` : "";
    const ho = e.handoff
      ? (e.handoff.para ? ` · handoff na Semana ${e.handoff.semana} para ${e.handoff.para}`
        : ` · recebe handoff de ${e.handoff.de} na Semana ${e.handoff.semana}`)
      : "";
    const aula = e.acompanhaAulas ? ` · acompanha as ${aulas.length} aulas` : " · não acompanha as aulas";
    return `${periodo}${datas}${ho}${aula}`;
  }

  function selecionar(id) {
    sel = id || null;
    quadro.classList.toggle("has-sel", !!sel);
    quadro.querySelectorAll(".pill").forEach(el => el.classList.toggle("is-sel", el.dataset.eq === sel));
    filtros.querySelectorAll(".pill").forEach(el => el.setAttribute("aria-pressed", String((el.dataset.eq || null) === sel)));
    const e = eqs.find(x => x.id === sel);
    if (e) {
      resumo.style.setProperty("--c", e.cor);
      resumo.replaceChildren(h("b", {}, e.nome), h("span", {}, textoEquipe(e)),
        h("button", { type: "button", "aria-label": "Mostrar todas as equipes" }, "Ver todas ×"));
      resumo.querySelector("button").addEventListener("click", () => selecionar(null));
      resumo.hidden = false;
    } else {
      resumo.hidden = true;
      resumo.replaceChildren();
    }
    history.replaceState(null, "", location.pathname + location.search + (sel ? "#" + sel : ""));
  }

  montarTopo();
  montarQuadro();
  montarFiltros();
  const doHash = () => { const id = decodeURIComponent(location.hash.slice(1)); return eqs.some(e => e.id === id) ? id : null; };
  selecionar(doHash());
  addEventListener("hashchange", () => selecionar(doHash()));
})();
</script>
</body>
</html>
